<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Low-Poly Gear Generator</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; background: #2a2a35; color: #ddd; display: flex; height: 100vh; }
    #canvas-container { flex: 1 1 auto; min-width: 0; height: 100vh; position: relative; }
    #canvas-container canvas { display: block; }

    #ui-panel {
      flex: 0 0 390px; box-sizing: border-box; height: 100vh; overflow-y: auto;
      background: #14141c; padding: 20px; border-right: 1px solid #445;
    }
    #ui-panel::-webkit-scrollbar { width: 5px; }
    #ui-panel::-webkit-scrollbar-thumb { background: #667; border-radius: 3px; }
    #ui-panel.hidden { display: none; }
    #show-panel { display: none; }
    /* card mode: a 2D canvas paints the finished card over the (invisible) 3D view */
    #cardCanvas { position: absolute; inset: 0; display: none; pointer-events: none; z-index: 1; }
    .fx-row { display: grid; grid-template-columns: 1fr 46px; gap: 8px; align-items: end; }
    .fx-row input[type=color] { height: 28px; margin-bottom: 12px; }
    .card-only { display: none !important; }
    body.card .card-only { display: inline-flex !important; }

    .panel-header { display: flex; justify-content: space-between; align-items: center; margin: 0 0 15px 0; border-bottom: 1px solid #445; padding-bottom: 10px; }
    h2 { margin: 0; font-size: 1.2rem; color: #fff; }

    .item-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-bottom: 12px; }
    button { display: inline-flex; align-items: center; justify-content: center; background: #3a3a4d; color: #fff; border: 1px solid #556; padding: 8px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; transition: 0.2s; }
    button:hover { background: #4f46e5; border-color: #6366f1; }
    button.active { background: #4f46e5; border-color: #818cf8; }

    details { background: #1f1f2a; margin-bottom: 8px; border-radius: 6px; border: 1px solid #334; }
    summary { padding: 10px; cursor: pointer; font-weight: bold; font-size: 0.85rem; outline: none; }
    .details-content { padding: 10px; border-top: 1px solid #334; background: #181822; }

    .control-group { margin-bottom: 12px; }
    label { display: flex; justify-content: space-between; font-size: 0.75rem; margin-bottom: 4px; color: #aaa; text-transform: uppercase; }
    label.check { justify-content: flex-start; gap: 8px; cursor: pointer; }
    input[type=range] { width: 100%; accent-color: #4f46e5; height: 4px; }
    input[type=color] { width: 100%; height: 30px; border: none; border-radius: 4px; cursor: pointer; background: transparent; }
    #ui-panel input[type=text] { width: 100%; box-sizing: border-box; background: #2a2a38; color: #fff; border: 1px solid #556; border-radius: 4px; padding: 6px; font-size: 0.85rem; }
    select { width: 100%; background: #2a2a38; color: #fff; border: 1px solid #556; border-radius: 4px; padding: 6px; font-size: 0.85rem; }
    .color-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }
    .group-label { grid-column: 1 / -1; font-size: 0.72rem; color: #8a8aa0; text-transform: uppercase; letter-spacing: 0.04em; margin: 6px 0 0; }
    .val-display { color: #fff; font-weight: bold; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/GLTFExporter.js"></script>
  <script src="icons.js"></script>
  <script src="panel.js"></script>
  <script src="camkeys.js"></script>
  <script src="silhouette.js"></script>
  <link rel="stylesheet" href="studio.css">
</head>
<body>

  <div id="ui-panel">
    <div class="panel-header">
      <h2>Gear Generator</h2>
      <button id="hide-panel" title="Hide controls (H)"><i data-icon="close"></i>Hide</button>
    </div>

    <div class="item-grid" id="itemButtons"></div>
    <div class="action-row">
      <button id="randomizeColors"><i data-icon="palette"></i>Randomize Colors</button>
      <button id="resetColors"><i data-icon="reset"></i>Default Colors</button>
    </div>

    <details data-cat="shape" data-chip="Item style" open>
      <summary id="styleTitle">Style</summary>
      <div class="details-content">
        <div class="control-group" id="variantGroup"><label>Variant</label><select id="variant"></select></div>
        <div class="control-group" id="textGroup"><label>Sign text</label><input type="text" id="itemText" maxlength="18"></div>
        <div class="color-grid" id="colorGrid"></div>
        <div class="control-group" id="glowGroup"><label class="check"><input type="checkbox" id="glow" checked> Light on (glows)</label></div>
        <div class="control-group" id="steamGroup"><label class="check"><input type="checkbox" id="steam" checked> Steam</label></div>
      </div>
    </details>

    <details data-cat="shape" open>
      <summary>Display</summary>
      <div class="details-content">
        <div class="fx-row"><div class="control-group"><label class="check"><input type="checkbox" id="silhouette"> Silhouette (all one color)</label></div><input type="color" id="silColor" value="#000000" title="Silhouette color"></div>
        <div class="control-group"><label class="check"><input type="checkbox" id="snowBase"> Sitting in a snow drift</label></div>
        <div class="control-group"><label>Turn <span class="val-display" id="turn-val">0</span></label><input type="range" id="turn" min="-180" max="180" step="1" value="0"></div>
      </div>
    </details>

    <details data-cat="card" open>
      <summary>Card</summary>
      <div class="details-content">
        <div class="control-group"><label class="check"><input type="checkbox" id="cardMode"> Card mode: background, effects, Save Card PNG</label></div>
        <div id="cardControls" style="display: none;">
          <div class="item-grid" id="cardStyleBtns"></div>
          <div class="control-group"><label>Background</label>
            <select id="cardBg">
              <option value="facets">Low-poly facets</option>
              <option value="lowpoly">Low-poly white (textured)</option>
              <option value="snow">Snowy</option>
              <option value="radial">Radial glow</option>
              <option value="paper">Paper</option>
              <option value="night">Night sky</option>
              <option value="solid">Solid color</option>
            </select></div>
          <div class="color-grid">
            <div class="control-group"><label>Color 1</label><input type="color" id="cardC1" value="#DCE8F2"></div>
            <div class="control-group"><label>Color 2</label><input type="color" id="cardC2" value="#93AFC6"></div>
          </div>
          <div class="control-group"><label>Item size <span class="val-display" id="cardSize-val">0.70</span></label><input type="range" id="cardSize" min="0.3" max="0.95" step="0.01" value="0.7"></div>
        </div>
      </div>
    </details>

    <details id="cardFxBox" style="display: none;" data-cat="card" open>
      <summary>Card Effects</summary>
      <div class="details-content">
        <div class="fx-row"><div class="control-group"><label>Outline <span class="val-display" id="fxOutline-val">0.50</span></label><input type="range" id="fxOutline" min="0" max="1" step="0.05" value="0.5"></div><input type="color" id="fxOutlineColor" value="#FFFFFF" title="Outline color"></div>
        <div class="fx-row"><div class="control-group"><label>Glow <span class="val-display" id="fxGlow-val">0.00</span></label><input type="range" id="fxGlow" min="0" max="1" step="0.05" value="0"></div><input type="color" id="fxGlowColor" value="#FFFFFF" title="Glow color"></div>
        <div class="fx-row"><div class="control-group"><label>Sparkles <span class="val-display" id="fxSparkle-val">0.00</span></label><input type="range" id="fxSparkle" min="0" max="1" step="0.05" value="0"></div><input type="color" id="fxSparkleColor" value="#FFFFFF" title="Sparkles color"></div>
        <div class="fx-row"><div class="control-group"><label>Focus lines <span class="val-display" id="fxFocus-val">0.00</span></label><input type="range" id="fxFocus" min="0" max="1" step="0.05" value="0"></div><input type="color" id="fxFocusColor" value="#1D1F26" title="Focus lines color"></div>
        <div class="fx-row"><div class="control-group"><label>Sunburst <span class="val-display" id="fxBurst-val">0.00</span></label><input type="range" id="fxBurst" min="0" max="1" step="0.05" value="0"></div><input type="color" id="fxBurstColor" value="#FFFFFF" title="Sunburst color"></div>
        <div class="fx-row"><div class="control-group"><label>Rings <span class="val-display" id="fxRings-val">0.00</span></label><input type="range" id="fxRings" min="0" max="1" step="0.05" value="0"></div><input type="color" id="fxRingsColor" value="#FFFFFF" title="Rings color"></div>
        <div class="control-group"><label>Vignette <span class="val-display" id="fxVignette-val">0.25</span></label><input type="range" id="fxVignette" min="0" max="1" step="0.05" value="0.25"></div>
        <div class="fx-row"><div class="control-group"><label>Border <span class="val-display" id="fxBorder-val">0.40</span></label><input type="range" id="fxBorder" min="0" max="1" step="0.05" value="0.4"></div><input type="color" id="fxBorderColor" value="#FFFFFF" title="Border color"></div>
        <div class="control-group"><label class="check"><input type="checkbox" id="cardShadow" checked> Soft shadow under the item</label></div>
        <button id="rerollCard" style="width: 100%;" title="New sparkle and background layout"><i data-icon="dice"></i>Reroll sparkles &amp; pattern</button>
      </div>
    </details>

    <details data-cat="scene">
      <summary>Background & Sun</summary>
      <div class="details-content">
        <div class="control-group"><label>Background</label><input type="color" id="bgColor" value="#8BA6B5"></div>
        <div class="control-group"><label>Sun Direction <span class="val-display" id="sunAz-val">45</span></label><input type="range" id="sunAz" min="0" max="360" step="1" value="45"></div>
        <div class="control-group"><label>Sun Height <span class="val-display" id="sunEl-val">55</span></label><input type="range" id="sunEl" min="-20" max="90" step="1" value="55"></div>
        <div class="control-group"><label>Sun Color</label><input type="color" id="sunColor" value="#FFF5E6"></div>
        <div class="control-group"><label>Sun Strength <span class="val-display" id="sunInt-val">0.90</span></label><input type="range" id="sunInt" min="0" max="2.5" step="0.05" value="0.9"></div>
        <div class="control-group"><label>Ambient Light <span class="val-display" id="ambInt-val">0.60</span></label><input type="range" id="ambInt" min="0" max="1.5" step="0.05" value="0.6"></div>
      </div>
    </details>
  </div>

  <div id="view-col">
    <div class="topbar">
      <button id="show-panel" title="Show controls (H)"><i data-icon="menu"></i>Controls</button>
      <label>Name <input type="text" id="charName" value="Gear" maxlength="40" size="12" title="Used for saved file names"></label>
      <button id="loadChar" title="Open a saved gear item (.json)"><i data-icon="folder"></i>Load</button>
      <button id="saveChar" title="Save this gear item (.json)"><i data-icon="download"></i>Save</button>
      <span class="sep"></span>
      <button id="savePng" title="Transparent PNG of just the item"><i data-icon="image"></i>Save PNG</button>
      <select id="exportScale" title="PNG size">
        <option value="1">1× screen</option><option value="2" selected>2× screen</option><option value="3">3× screen</option>
      </select>
      <button id="export3d" title="3D model for the scene tool or Blender (.glb)"><i data-icon="cube"></i>Export 3D</button>
      <span class="sep card-only"></span>
      <label class="card-only">Card frame
        <select id="cardAspect">
          <option value="5:7" selected>Portrait card (2.5 × 3.5)</option>
          <option value="7:5">Landscape card (3.5 × 2.5)</option>
          <option value="1:1">Square</option>
          <option value="4:3">Art box 4:3</option>
        </select>
      </label>
      <label class="card-only" title="1500 px wide = 600 dpi on a 2.5 inch poker card">Width <input type="number" id="cardWidth" value="1500" min="300" max="4000" step="50" style="width: 76px;"> px</label>
      <button class="primary card-only" id="saveCard"><i data-icon="image"></i>Save Card PNG</button>
      <input type="file" id="loadCharFile" accept=".json,application/json" style="display: none;">
    </div>
    <div id="canvas-container">
      <canvas id="cardCanvas"></canvas>
      <div class="viewbar">
        <button id="centerCam" title="Frame the item in the view"><i data-icon="target"></i>Center</button>
        <span class="keys"><b>W A S D</b> move &middot; <b>E</b>/<b>Q</b> up, down &middot; <b>Arrows</b> look &middot; <b>Drag</b> orbit &middot; <b>Right-drag</b> pan</span>
      </div>
      <button class="primary float-br" id="sendToScene" style="display: none;"><i data-icon="send"></i>Send to Scene</button>
    </div>
  </div>

  <script>
    // --- SCENE SETUP ---
    const $ = id => document.getElementById(id);
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x8ba6b5);

    const canvasContainer = $('canvas-container');
    const camera = new THREE.PerspectiveCamera(35, 1, 0.005, 50);
    camera.position.set(0.6, 0.45, 0.8);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true }); // alpha so PNGs export without a background
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    canvasContainer.appendChild(renderer.domElement);

    function fitRenderer() {
      const w = canvasContainer.clientWidth, h = canvasContainer.clientHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    }
    fitRenderer();
    new ResizeObserver(fitRenderer).observe(canvasContainer);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    const cameraKeys = enableCameraKeys(camera, controls, { speed: 0.6 }); // WASD + Q/E
    enableClickOrbit(camera, controls, () => [itemGroup]); // drag turns around the point you clicked
    controls.target.set(0, 0.1, 0);

    // --- LIGHTING ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);
    const keyLight = new THREE.DirectionalLight(0xfff5e6, 0.9);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(2048, 2048);
    Object.assign(keyLight.shadow.camera, { left: -1.6, right: 1.6, top: 1.6, bottom: -1.6, near: 0.1, far: 30 });
    keyLight.shadow.bias = -0.0005;
    keyLight.shadow.normalBias = 0.004;
    keyLight.target.position.set(0, 0.1, 0);
    scene.add(keyLight, keyLight.target);
    const fillLight = new THREE.DirectionalLight(0xaaccff, 0.6);
    fillLight.position.set(-8, 3, -8);
    scene.add(fillLight);

    const bgColor = new THREE.Color();
    let lightDist = 6; // big items (the finish gate) push the sun back and widen its shadow
    function fitShadow(radius) {
      const e = Math.max(1.6, radius * 1.15);
      Object.assign(keyLight.shadow.camera, { left: -e, right: e, top: e, bottom: -e, far: Math.max(30, radius * 8) });
      keyLight.shadow.camera.updateProjectionMatrix();
      lightDist = Math.max(6, radius * 2.5);
      keyLight.target.position.set(0, Math.min(radius * 0.5, 2), 0);
    }
    function updateScene() {
      const az = THREE.MathUtils.degToRad(+$('sunAz').value), el = THREE.MathUtils.degToRad(+$('sunEl').value);
      keyLight.position.set(lightDist * Math.cos(el) * Math.sin(az), 0.1 + lightDist * Math.sin(el), lightDist * Math.cos(el) * Math.cos(az));
      keyLight.color.set($('sunColor').value);
      keyLight.intensity = +$('sunInt').value;
      ambientLight.intensity = +$('ambInt').value;
      bgColor.set($('bgColor').value);
      scene.background = cardOn() ? null : bgColor; // the card paints its own background
      ['sunAz', 'sunEl'].forEach(id => $(id + '-val').innerText = $(id).value);
      ['sunInt', 'ambInt'].forEach(id => $(id + '-val').innerText = (+$(id).value).toFixed(2));
    }

    // --- BUILDING BLOCKS (units are meters) ---
    const itemGroup = new THREE.Group();
    scene.add(itemGroup);
    // Every render goes through here: with Silhouette on, the item draws in one flat color (just for the render)
    function renderView() {
      if ($('silhouette').checked) Silhouette.render(renderer, scene, camera, itemGroup, $('silColor').value);
      else renderer.render(scene, camera);
    }

    const mat = (color, opts = {}) => new THREE.MeshStandardMaterial({ color, flatShading: true, roughness: 0.8, ...opts });
    // part-metal: with no surroundings to reflect, fully metallic surfaces render nearly black
    const metal = (color, opts = {}) => mat(color, { metalness: 0.4, roughness: 0.38, ...opts });

    function add(parent, geo, material, pos = [0, 0, 0], rot = [0, 0, 0], scale = [1, 1, 1]) {
      const m = new THREE.Mesh(geo, material);
      m.position.set(...pos);
      m.rotation.set(...rot);
      m.scale.set(...scale);
      m.castShadow = true;
      m.receiveShadow = true;
      parent.add(m);
      return m;
    }
    const box = (w, h, d, sx = 1, sy = 1, sz = 1) => new THREE.BoxGeometry(w, h, d, sx, sy, sz);
    const cyl = (rt, rb, h, seg = 8, open = false) => new THREE.CylinderGeometry(rt, rb, h, seg, 1, open);
    const ico = (r, detail = 1) => new THREE.IcosahedronGeometry(r, detail);
    const lathe = (pts, seg = 12) => new THREE.LatheGeometry(pts.map(([x, y]) => new THREE.Vector2(x, y)), seg);
    const torus = (R, r, arc = Math.PI * 2, tubular = 14) => new THREE.TorusGeometry(R, r, 4, tubular, arc);
    const V = (x, y, z) => new THREE.Vector3(x, y, z);
    // tapered cylinder from a (wide end) to b, for legs and necks
    function limb(parent, material, a, b, r) {
      const dir = new THREE.Vector3().subVectors(a, b);
      const m = add(parent, cyl(r, r * 0.8, dir.length(), 7), material, [(a.x + b.x) / 2, (a.y + b.y) / 2, (a.z + b.z) / 2]);
      m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize());
      return m;
    }
    const tube = (pts, r, seg = 24, radial = 5) => new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts.map(p => new THREE.Vector3(...p))), seg, r, radial, false);

    // Flat strap (webbing) following points on the ground plane: a row of thin boxes
    function strap(parent, material, pts, width, thick = 0.012, y = 0.007) {
      for (let i = 0; i < pts.length - 1; i++) {
        const [x1, z1] = pts[i], [x2, z2] = pts[i + 1];
        const len = Math.hypot(x2 - x1, z2 - z1);
        add(parent, box(len + width * 0.6, thick, width), material, [(x1 + x2) / 2, y, (z1 + z2) / 2], [0, -Math.atan2(z2 - z1, x2 - x1), 0]);
      }
    }

    // Seeded randomness so an item looks the same every time it's rebuilt
    function rng(seed) {
      let a = seed;
      return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    }

    // A waving flag on the plane x-y, attached along its left edge at x = 0 (dir < 0 flips it to blow left)
    function flagGeo(w, h, dir) {
      const geo = new THREE.PlaneGeometry(w, h, 6, 2), p = geo.attributes.position;
      for (let i = 0; i < p.count; i++) {
        const x = p.getX(i) + w / 2, t = x / w;
        p.setXYZ(i, Math.sign(dir) * x, p.getY(i) - t * t * h * 0.15, Math.sin(t * Math.PI * 1.6) * 0.08 * t);
      }
      geo.computeVertexNormals();
      return geo;
    }
    // A string of triangle pennants hanging between two points with a little sag
    function bunting(parent, a, b, sag, colors, offset = 0) {
      const pts = [];
      for (let i = 0; i <= 16; i++) { const t = i / 16; pts.push(new THREE.Vector3().lerpVectors(a, b, t).add(V(0, -sag * 4 * t * (1 - t), 0))); }
      const curve = new THREE.CatmullRomCurve3(pts);
      add(parent, new THREE.TubeGeometry(curve, 32, 0.008, 4, false), mat('#3A2A1E'));
      const n = Math.max(2, Math.round(curve.getLength() / 0.3)), pw = 0.2, ph = 0.26;
      for (let k = 0; k < n; k++) {
        const t = (k + 0.5) / n, p = curve.getPoint(t), tan = curve.getTangent(t);
        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.Float32BufferAttribute([-pw / 2, 0, 0, pw / 2, 0, 0, 0, -ph, 0], 3));
        geo.computeVertexNormals();
        const m = add(parent, geo, mat(colors[(k + offset) % colors.length], { side: THREE.DoubleSide, roughness: 0.8 }), [p.x, p.y, p.z]);
        m.rotation.set(Math.sin(k * 2.3) * 0.2, -Math.atan2(tan.z, tan.x), Math.atan2(tan.y, Math.hypot(tan.x, tan.z))); // follow the string, swing a little
        m.rotation.order = 'YZX';
      }
    }
    // The sign's painted face: planks with a little grain, and the words fitted to the board
    function signTexture(text, bg, ink) {
      const c = document.createElement('canvas');
      c.width = 1024; c.height = 256;
      const g = c.getContext('2d'), r = rng(9);
      g.fillStyle = bg; g.fillRect(0, 0, c.width, c.height);
      g.strokeStyle = 'rgba(60, 40, 20, 0.12)'; g.lineWidth = 3;
      for (let k = 0; k < 14; k++) { const y = r() * c.height; g.beginPath(); g.moveTo(0, y); g.bezierCurveTo(300, y + (r() - 0.5) * 20, 700, y + (r() - 0.5) * 20, 1024, y); g.stroke(); }
      g.fillStyle = 'rgba(60, 40, 20, 0.25)'; g.fillRect(0, c.height / 2 - 2, c.width, 4); // two planks
      const words = (text || '').trim().toUpperCase();
      if (words) {
        let size = 170;
        g.font = `900 ${size}px "Arial Black", "Segoe UI Black", Impact, sans-serif`;
        size = Math.min(size, size * 900 / g.measureText(words).width);
        g.font = `900 ${size}px "Arial Black", "Segoe UI Black", Impact, sans-serif`;
        g.textAlign = 'center'; g.textBaseline = 'middle';
        g.fillStyle = 'rgba(255, 255, 255, 0.35)'; g.fillText(words, c.width / 2 + 3, c.height / 2 + 5);
        g.fillStyle = ink; g.fillText(words, c.width / 2, c.height / 2);
      }
      const t = new THREE.CanvasTexture(c);
      t.encoding = THREE.sRGBEncoding;
      t.anisotropy = 4;
      return t;
    }

    // --- THE ITEMS ---
    // Each item: label, colors ({ key: [label, default] }), variants, optional glow/steam, and build(group, colors, variant, opts)
    const ITEMS = {
      snack: {
        label: 'Snack', colors: { wrapper: ['Wrapper', '#D9482B'], label: ['Label', '#F2C12E'], food: ['Food', '#7A4A24'] },

      mittens: {
        label: 'Mittens', colors: { mitten: ['Mitten', '#C8423B'], cuff: ['Cuff', '#F2EEE3'], stripe: ['Stripe', '#1E2D4A'] },
        variants: ['Single', 'Pair', 'On a string', 'Lying back'],
        build(g, c, v) {
          // Built upright, palm toward +z, cuff at the bottom, thumb on the left. The thumb angles well out from
          // the hand with a clear V between them, so the shape reads as a mitten even as a tiny black icon.
          const knit = mat(c.mitten, { roughness: 1 }), cuffM = mat(c.cuff, { roughness: 1 }), stripeM = mat(c.stripe, { roughness: 1 });
          const flat = 0.44; // mittens are flatter front to back than they are wide
          const makeMitten = () => {
            const M = new THREE.Group();
            // slightly flared cuff; its facets read as ribbing and keep a clean edge in silhouette
            add(M, cyl(0.054, 0.06, 0.062, 12), cuffM, [0, 0.031, 0], [0, 0, 0], [1, 1, flat + 0.06]);
            // hand: a rounded body with a domed top
            add(M, cyl(0.05, 0.048, 0.1, 10), knit, [0, 0.112, 0], [0, 0, 0], [1, 1, flat]);
            add(M, ico(1, 1), knit, [0, 0.162, 0], [0, 0, 0], [0.05, 0.058, 0.05 * flat]);
            add(M, cyl(0.0505, 0.0505, 0.016, 10), stripeM, [0, 0.088, 0], [0, 0, 0], [1, 1, flat + 0.01]);   // stripe
            // thumb: from the side of the palm, angled out ~37 degrees, rounded tip
            const T = new THREE.Group();
            T.position.set(-0.04, 0.084, 0); T.rotation.z = 0.65;
            add(T, cyl(0.016, 0.019, 0.06, 8), knit, [0, 0.03, 0], [0, 0, 0], [1, 1, 0.8]);
            add(T, ico(0.016, 1), knit, [0, 0.06, 0], [0, 0, 0], [1, 1, 0.8]);
            M.add(T);
            return M;
          };
          const face = 0.64;   // turn the palm toward the default camera
          if (v === 'Single') {   // the icon pose: leaning a touch to the right, thumb out to the left
            const M = makeMitten(); M.rotation.z = -0.1;
            const H = new THREE.Group(); H.add(M); H.rotation.y = face; g.add(H);
          } else if (v === 'Pair' || v === 'On a string') {
            const P = new THREE.Group();
            [-1, 1].forEach(s => {
              const M = makeMitten();
              M.scale.x = -s;   // the right mitten is a mirror image, so both thumbs point out
              M.position.x = s * 0.085; M.rotation.z = -s * 0.12;
              P.add(M);
            });
            if (v === 'On a string') // a cord between the cuffs, drooping onto the snow
              add(P, tube([[-0.09, 0.02, 0], [-0.05, 0.006, 0.02], [0, 0.004, 0.03], [0.05, 0.006, 0.02], [0.09, 0.02, 0]], 0.004, 24, 5), stripeM);
            P.rotation.y = face; g.add(P);
          } else {   // dropped on its back, palm up toward the camera (tick "Sitting in a snow drift" for snow)
            const M = makeMitten(); M.rotation.set(-0.97, 0, 0.12);
            const H = new THREE.Group(); H.add(M); H.rotation.y = face; g.add(H);
          }
        }
      },

      cabin: {

        build(g, c, v, o) {
          // a one-room log cabin, gable end facing front (+z): door and two windows below, one window up in the gable
          const W = 5, D = 4.4, H = 2.4, fy = 0.25, rise = 1.6, lr = 0.13, ext = 0.28, snowy = v === 'Snowy roof';

          const logM = [0.92, 1, 1.07].map(k => mat(col(c.logs, k), { roughness: 0.95 }));

          add(g, box(W - 0.1, H - fy, D - 0.1), mat(col(c.logs, 0.55)), [0, fy + (H - fy) / 2, 0]);       // dark chinking behind the logs
          // walls: front and back logs, side logs half a log higher, all poking out past the corners
          const rows = Math.floor((H - fy) / (2 * lr));
          const log = (len, pos, alongX) => {
            const m = add(g, cyl(lr, lr, len, 7), logM[Math.floor(r() * 3)], pos, alongX ? [0, 0, Math.PI / 2] : [Math.PI / 2, 0, 0]);
            m.rotateY(r() * 3);
            return m;
          };
          for (let i = 0; i < rows; i++) {
            const y = fy + lr + i * 2 * lr;
            [-1, 1].forEach(s => log(W + 2 * ext, [0, y, s * D / 2], true));
            if (y + lr < H) [-1, 1].forEach(s => log(D + 2 * ext, [s * W / 2, y + lr, 0], false));
          }
          [-1, 1].forEach(sx => [-1, 1].forEach(sz => { // log ends at the corners

          }));

            gab.castShadow = true;
            for (let y = H + lr; y < H + rise - 0.25; y += 2 * lr) log(W * (1 - (y - H + lr) / rise), [0, y, s * D / 2], true);

          const ridgeY = H + rise, a = Math.atan(rise / (W / 2)), run = W / 2 + 0.5, thick = 0.14, len = run / Math.cos(a) + 0.05, depth = D + 1.0;

            if (snowy) {

            } else {
              for (let k = 1; k < 7; k++) slab(s, thick + 0.015, 0.03, len * (1 - k / 7) + 0.02, depth, mat(col(c.roof, 0.8))); // shingle steps

          });
          add(g, cyl(0.1, 0.1, depth + (snowy ? 0.1 : 0), 6), snowy ? snow : mat(col(c.roof, 0.8)), [0, ridgeY + (snowy ? 0.32 : 0.18), 0], [Math.PI / 2, 0, 0]); // ridge cap

          for (let y = roofAt - 0.6, k = 0; y < chTop; y += 0.26, k++) {

          if (o.steam) {

          [0.45, 1.55].forEach(y => add(g, box(doorW - 0.1, 0.08, 0.03), mat(col(c.door, 0.8)), [doorX, fy + y, fz + 0.045]));   // braces

          [-1, 1].forEach(s => add(g, box(0.1, doorH + 0.1, 0.1), trim, [doorX + s * (doorW / 2 + 0.05), fy + doorH / 2, fz + 0.02]));

    // --- SAVE PNG (transparent, cropped, whole item in frame) ---
    function exportPNG(filename) {
      const scale = parseFloat($('exportScale').value);
      const oldBg = scene.background, oldRatio = renderer.getPixelRatio();
      const oldPos = camera.position.clone(), oldQuat = camera.quaternion.clone();
      itemGroup.updateMatrixWorld(true);
      const sphere = new THREE.Box3().setFromObject(itemGroup).getBoundingSphere(new THREE.Sphere());
      const dir = new THREE.Vector3();
      camera.getWorldDirection(dir);
      const halfFov = THREE.MathUtils.degToRad(camera.fov) / 2;
      const fitFov = Math.min(halfFov, Math.atan(Math.tan(halfFov) * camera.aspect));
      camera.position.copy(sphere.center).addScaledVector(dir, -sphere.radius / Math.sin(fitFov) * 1.05);
      camera.lookAt(sphere.center);
      scene.background = null;
      renderer.setPixelRatio(oldRatio * scale);
      renderView();
      const url = cropToContent(renderer.domElement).toDataURL('image/png');
      scene.background = oldBg;
      renderer.setPixelRatio(oldRatio);
      camera.position.copy(oldPos);
      camera.quaternion.copy(oldQuat);
      const link = document.createElement('a');
      link.download = filename;
      link.href = url;
      link.click();
    }

    function cropToContent(src) {
      const c = document.createElement('canvas');
      c.width = src.width; c.height = src.height;
      const g = c.getContext('2d');
      g.drawImage(src, 0, 0);
      const { data, width, height } = g.getImageData(0, 0, c.width, c.height);
      let x0 = width, y0 = height, x1 = -1, y1 = -1;
      for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
          if (data[(y * width + x) * 4 + 3] > 8) {
            if (x < x0) x0 = x; if (x > x1) x1 = x;
            if (y < y0) y0 = y; if (y > y1) y1 = y;
          }
        }
      }
      if (x1 < 0) return c;
      const pad = 6;
      x0 = Math.max(0, x0 - pad); y0 = Math.max(0, y0 - pad);
      x1 = Math.min(width - 1, x1 + pad); y1 = Math.min(height - 1, y1 + pad);
      const out = document.createElement('canvas');
      out.width = x1 - x0 + 1; out.height = y1 - y0 + 1;
      out.getContext('2d').drawImage(c, x0, y0, out.width, out.height, 0, 0, out.width, out.height);
      return out;
    }

    // --- SAVE / LOAD & 3D EXPORT ---
    const fileBase = () => ($('charName').value.trim() || 'gear').replace(/[^\w\- ]+/g, '');

    function downloadBlob(blob, filename) {
      const link = document.createElement('a');

    function gearState() {
      const values = {};
      document.querySelectorAll('#ui-panel input, #ui-panel select, .topbar input, .topbar select').forEach(el => {
        if (!el.id || el.type === 'file') return;
        values[el.id] = el.type === 'checkbox' ? el.checked : el.value;
      });
      return { type: 'gear', version: 1, item: currentItem, itemSettings: stateOf(currentItem), cardSeed, values };
    }

    function applyGearState(state) {
      if (state.type !== 'gear' || !ITEMS[state.item]) { alert(`That file is a ${state.type || 'different'} file, not a gear item.`); return; }
      for (const id in state.values) {
        const el = $(id);
        if (!el || el.type === 'file') continue;
        if (el.type === 'checkbox') el.checked = state.values[id];
        else el.value = state.values[id];
      }
      itemState[state.item] = JSON.parse(JSON.stringify(state.itemSettings));
      $('turn-val').innerText = $('turn').value;
      updateScene();
      currentItem = state.item;
      if (state.cardSeed) cardSeed = state.cardSeed;
      refreshStyleUI();
      buildItem();
      refreshFxLabels();
      updateCardMode();

    // Real-world size (meters), standing on y = 0 and centered, for the scene tool or Blender
    function export3D(deliver = (buffer, name) => downloadBlob(new Blob([buffer], { type: 'model/gltf-binary' }), `${name}.glb`)) {
      const target = itemGroup, name = fileBase();
      target.updateMatrixWorld(true);
      const box3 = new THREE.Box3().setFromObject(target), center = box3.getCenter(new THREE.Vector3());
      const savedPos = target.position.clone();
      target.position.x -= center.x;
      target.position.z -= center.z;
      target.position.y -= box3.min.y;
      const savedUD = target.userData;
      target.userData = { longTrail: { type: 'gear', unitScale: 1, name } };
      target.updateMatrixWorld(true);
      new THREE.GLTFExporter().parse(target, result => {
        target.userData = savedUD;
        target.position.copy(savedPos);
        target.updateMatrixWorld(true);
        deliver(result, name);
      }, { binary: true });
    }

    if (studio) {

    // ================= CARD MODE =================
    // The item is rendered with a transparent background and painted onto a 2D card: background, effects
    // behind the item, the item (optionally outlined), then effects in front. The live preview and
    // Save Card PNG use the same drawing code, sized from the card frame, so they match.
    const cardCanvas = $('cardCanvas');
    const cardOn = () => $('cardMode').checked;
    const fxv = id => +$(id).value;
    let cardSeed = 1;
    const outlineA = document.createElement('canvas'), outlineB = document.createElement('canvas');

    function cardFrameRect() { // CSS pixels inside the 3D view
      const cw = canvasContainer.clientWidth, ch = canvasContainer.clientHeight;
      const [aw, ah] = $('cardAspect').value.split(':').map(Number), m = 24;
      let h = ch - m * 2, w = h * aw / ah;
      if (w > cw - m * 2) { w = cw - m * 2; h = w * ah / aw; }
      return { x: (cw - w) / 2, y: (ch - h) / 2, w, h };
    }

    function itemSphere() {
      itemGroup.updateMatrixWorld(true);
      return new THREE.Box3().setFromObject(itemGroup).getBoundingSphere(new THREE.Sphere());
    }

    // Where the item sits on screen (center + radius in pixels of a w x h view) for a given camera
    function projectItem(cam, w, h) {
      const sp = itemSphere(), p = sp.center.clone().project(cam);
      const dist = cam.position.distanceTo(sp.center);
      return { x: (p.x + 1) / 2 * w, y: (1 - p.y) / 2 * h,
               r: (sp.radius / dist) / Math.tan(THREE.MathUtils.degToRad(cam.fov) / 2) * (h / 2) };
    }

    // Pull the camera along its view line so the item fills "Item size" of the card's height
    function fitToCard() {
      const sp = itemSphere(), fr = cardFrameRect(), ch = canvasContainer.clientHeight;
      const dir = new THREE.Vector3();
      camera.getWorldDirection(dir);
      const d = sp.radius * ch / (fxv('cardSize') * fr.h * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2));
      controls.target.copy(sp.center);
      camera.position.copy(sp.center).addScaledVector(dir, -d);
      controls.update();
    }
    function frameItem() { if (cardOn()) fitToCard(); else centerCamera(); }

    const rgba = (hex, a) => { const c = new THREE.Color(hex); return `rgba(${Math.round(c.r * 255)}, ${Math.round(c.g * 255)}, ${Math.round(c.b * 255)}, ${a})`; };
    const mix = (h1, h2, t, light = 1) => { const c = new THREE.Color(h1).lerp(new THREE.Color(h2), THREE.MathUtils.clamp(t, 0, 1)).multiplyScalar(light); return `rgb(${Math.round(Math.min(1, c.r) * 255)}, ${Math.round(Math.min(1, c.g) * 255)}, ${Math.round(Math.min(1, c.b) * 255)})`; };

    function drawBackground(g, fr, r) {
      const c1 = $('cardC1').value, c2 = $('cardC2').value, style = $('cardBg').value;
      const { x, y, w, h } = fr, unit = Math.min(w, h);
      if (style === 'solid') { g.fillStyle = c1; g.fillRect(x, y, w, h); return; }
      if (style === 'lowpoly') { // color 1 shading toward color 2, with a paper grain (the silhouette card look)
        g.save(); g.beginPath(); g.rect(x, y, w, h); g.clip();
        Silhouette.drawBackground(g, fr, { color: c1, shade: c2, facets: 6, texture: 0.5, seed: cardSeed });
        g.restore();
        return;
      }
      if (style === 'radial') {
        const grad = g.createRadialGradient(x + w / 2, y + h * 0.45, 0, x + w / 2, y + h * 0.45, Math.hypot(w, h) * 0.6);
        grad.addColorStop(0, c1); grad.addColorStop(1, c2);
        g.fillStyle = grad; g.fillRect(x, y, w, h); return;
      }
      if (style === 'facets') { // low-poly triangles shading from color 1 (top) to color 2 (bottom)
        const cols = 6, rows = Math.max(4, Math.round(cols * h / w)), cw = w / cols, rh = h / rows, pts = [];
        for (let j = 0; j <= rows; j++) {
          pts.push([]);
          for (let i = 0; i <= cols; i++) {
            const edge = i === 0 || j === 0 || i === cols || j === rows;
            pts[j].push([x + i * cw + (edge ? 0 : (r() - 0.5) * cw * 0.7), y + j * rh + (edge ? 0 : (r() - 0.5) * rh * 0.7)]);
          }
        }
        const tri = (a, b, c) => {
          const t = ((a[1] + b[1] + c[1]) / 3 - y) / h;
          g.fillStyle = mix(c1, c2, t + (r() - 0.5) * 0.25, 0.94 + r() * 0.12);
          g.beginPath(); g.moveTo(...a); g.lineTo(...b); g.lineTo(...c); g.closePath(); g.fill();
          g.strokeStyle = g.fillStyle; g.lineWidth = 1; g.stroke(); // hide hairline seams
        };
        for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
          const p = pts[j][i], q = pts[j][i + 1], s = pts[j + 1][i], t2 = pts[j + 1][i + 1];
          if ((i + j) % 2) { tri(p, q, t2); tri(p, t2, s); } else { tri(p, q, s); tri(q, t2, s); }
        }
        return;
      }
      if (style === 'snow') {
        const grad = g.createLinearGradient(x, y, x, y + h);
        grad.addColorStop(0, c2); grad.addColorStop(1, c1);
        g.fillStyle = grad; g.fillRect(x, y, w, h);
        for (let k = 0; k < 260; k++) { // falling flakes
          g.fillStyle = `rgba(255, 255, 255, ${0.25 + r() * 0.6})`;
          g.beginPath(); g.arc(x + r() * w, y + r() * h, unit * (0.002 + r() * 0.007), 0, Math.PI * 2); g.fill();
        }
        g.fillStyle = 'rgba(255, 255, 255, 0.85)'; // a drift along the bottom
        g.beginPath(); g.moveTo(x, y + h);
        for (let k = 0; k <= 8; k++) g.lineTo(x + w * k / 8, y + h * (0.86 + Math.sin(k * 1.7 + r()) * 0.03));
        g.lineTo(x + w, y + h); g.closePath(); g.fill();
        return;
      }
      if (style === 'paper') {
        g.fillStyle = c1; g.fillRect(x, y, w, h);
        for (let k = 0; k < 2200; k++) {
          g.fillStyle = r() < 0.5 ? `rgba(0, 0, 0, ${r() * 0.05})` : `rgba(255, 255, 255, ${r() * 0.08})`;
          g.fillRect(x + r() * w, y + r() * h, unit * 0.004, unit * 0.004);
        }
        const burn = g.createRadialGradient(x + w / 2, y + h / 2, unit * 0.3, x + w / 2, y + h / 2, Math.hypot(w, h) * 0.55);
        burn.addColorStop(0, rgba(c2, 0)); burn.addColorStop(1, rgba(c2, 0.55));
        g.fillStyle = burn; g.fillRect(x, y, w, h);
        return;
      }
      if (style === 'night') {
        const grad = g.createLinearGradient(x, y, x, y + h);
        grad.addColorStop(0, c2); grad.addColorStop(1, c1);
        g.fillStyle = grad; g.fillRect(x, y, w, h);
        for (let k = 0; k < 220; k++) {
          g.fillStyle = `rgba(255, 255, 255, ${0.3 + r() * 0.7})`;
          const s = unit * (0.001 + r() * r() * 0.006);
          g.beginPath(); g.arc(x + r() * w, y + r() * h * 0.85, s, 0, Math.PI * 2); g.fill();
        }
      }
    }

    function star(g, cx, cy, s, color) { // four-point sparkle
      const i = s * 0.18;
      g.save();
      g.fillStyle = color; g.shadowColor = color; g.shadowBlur = s * 0.9;
      g.beginPath();
      g.moveTo(cx, cy - s); g.quadraticCurveTo(cx + i, cy - i, cx + s, cy); g.quadraticCurveTo(cx + i, cy + i, cx, cy + s);
      g.quadraticCurveTo(cx - i, cy + i, cx - s, cy); g.quadraticCurveTo(cx - i, cy - i, cx, cy - s);
      g.fill();
      g.restore();
    }

    function roundRectPath(g, x, y, w, h, rad) {
      g.beginPath();
      g.moveTo(x + rad, y); g.arcTo(x + w, y, x + w, y + h, rad); g.arcTo(x + w, y + h, x, y + h, rad);
      g.arcTo(x, y + h, x, y, rad); g.arcTo(x, y, x + w, y, rad); g.closePath();
    }

    // The item image with a solid outline: color the silhouette, stamp it in a ring, put the item on top
    function outlinedItem(src, t, color) {
      if (t < 0.5) return src;
      [outlineA, outlineB].forEach(c => { if (c.width !== src.width || c.height !== src.height) { c.width = src.width; c.height = src.height; } });
      const a = outlineA.getContext('2d'), b = outlineB.getContext('2d'), W = src.width, H = src.height;
      a.globalCompositeOperation = 'source-over'; a.clearRect(0, 0, W, H); a.drawImage(src, 0, 0);
      a.globalCompositeOperation = 'source-in'; a.fillStyle = color; a.fillRect(0, 0, W, H);
      a.globalCompositeOperation = 'source-over';
      b.clearRect(0, 0, W, H);
      for (const [rad, n] of [[t, 20], [t * 0.5, 10]]) for (let k = 0; k < n; k++) { const ang = k / n * Math.PI * 2; b.drawImage(outlineA, Math.cos(ang) * rad, Math.sin(ang) * rad); }
      b.drawImage(src, 0, 0);
      return outlineB;
    }

    // Paint the full card into rect fr. src is the transparent item render covering srcRect;
    // it = item center/radius in the same pixel space; pxScale = src pixels per drawing pixel.
    function composeCard(g, fr, src, srcRect, it, pxScale) {
      const r = rng(cardSeed * 7919 + 13), unit = Math.min(fr.w, fr.h), cx = it.x, cy = it.y, R = Math.max(it.r, unit * 0.05);
      const diag = Math.hypot(fr.w, fr.h);
      g.save();
      g.beginPath(); g.rect(fr.x, fr.y, fr.w, fr.h); g.clip();
      drawBackground(g, fr, r);

      const burst = fxv('fxBurst');
      if (burst > 0.01) { // sunburst wedges from the item
        g.fillStyle = rgba($('fxBurstColor').value, 0.28 * burst);
        const n = 18, rot = r() * Math.PI;
        for (let k = 0; k < n; k += 1) {
          if (k % 2) continue;
          const a0 = rot + k / n * Math.PI * 2, a1 = a0 + Math.PI * 2 / n;
          g.beginPath(); g.moveTo(cx, cy); g.lineTo(cx + Math.cos(a0) * diag, cy + Math.sin(a0) * diag); g.lineTo(cx + Math.cos(a1) * diag, cy + Math.sin(a1) * diag); g.closePath(); g.fill();
        }
      }
      const rings = fxv('fxRings');
      if (rings > 0.01) {
        for (let i = 0; i < 4; i++) {
          g.strokeStyle = rgba($('fxRingsColor').value, rings * (0.7 - i * 0.14));
          g.lineWidth = unit * (0.007 - i * 0.001);
          g.beginPath(); g.arc(cx, cy, R * (1.2 + i * 0.32), 0, Math.PI * 2); g.stroke();
        }
      }
      const focus = fxv('fxFocus');
      if (focus > 0.01) { // speed lines rushing in from the edges toward the item
        g.fillStyle = rgba($('fxFocusColor').value, 0.85 * focus);
        for (let k = 0, n = Math.round(50 + 110 * focus); k < n; k++) {
          const ang = r() * Math.PI * 2, inner = unit * (0.3 + r() * 0.22), wide = unit * (0.003 + r() * 0.011); // clear space in the middle for the item
          const dx = Math.cos(ang), dy = Math.sin(ang), px = -dy, py = dx;
          g.beginPath();
          g.moveTo(cx + dx * inner, cy + dy * inner);
          g.lineTo(cx + dx * diag + px * wide, cy + dy * diag + py * wide);
          g.lineTo(cx + dx * diag - px * wide, cy + dy * diag - py * wide);
          g.closePath(); g.fill();
        }
      }
      const glow = fxv('fxGlow');
      if (glow > 0.01) {
        const grad = g.createRadialGradient(cx, cy, R * 0.2, cx, cy, R * (1.4 + glow * 1.2));
        grad.addColorStop(0, rgba($('fxGlowColor').value, 0.95 * glow)); grad.addColorStop(1, rgba($('fxGlowColor').value, 0));
        g.fillStyle = grad; g.fillRect(fr.x, fr.y, fr.w, fr.h);
      }
      if ($('cardShadow').checked) {
        g.save();
        g.filter = `blur(${Math.max(1, unit * 0.012)}px)`;
        g.fillStyle = 'rgba(20, 30, 50, 0.3)';
        g.beginPath(); g.ellipse(cx, cy + R * 0.92, R * 0.75, R * 0.12, 0, 0, Math.PI * 2); g.fill();
        g.restore();
      }

      // the item itself
      const outline = fxv('fxOutline');
      g.drawImage(outlinedItem(src, outline * unit * 0.014 * pxScale, $('fxOutlineColor').value), srcRect.x, srcRect.y, srcRect.w, srcRect.h);

      const spark = fxv('fxSparkle');
      if (spark > 0.01) {
        for (let k = 0, n = Math.round(6 + 26 * spark); k < n; k++) {
          const ang = r() * Math.PI * 2, d = R * (0.75 + r() * 1.35);
          star(g, cx + Math.cos(ang) * d, cy + Math.sin(ang) * d, unit * (0.012 + r() * 0.035) * (0.6 + spark * 0.6), $('fxSparkleColor').value);
        }
      }
      const vig = fxv('fxVignette');
      if (vig > 0.01) {
        const grad = g.createRadialGradient(fr.x + fr.w / 2, fr.y + fr.h / 2, unit * 0.35, fr.x + fr.w / 2, fr.y + fr.h / 2, diag * 0.6);
        grad.addColorStop(0, 'rgba(0, 0, 0, 0)'); grad.addColorStop(1, `rgba(0, 0, 0, ${0.65 * vig})`);
        g.fillStyle = grad; g.fillRect(fr.x, fr.y, fr.w, fr.h);
      }
      const border = fxv('fxBorder');
      if (border > 0.01) {
        const inset = unit * 0.035;
        g.strokeStyle = $('fxBorderColor').value;
        g.lineWidth = unit * 0.02 * border;
        roundRectPath(g, fr.x + inset, fr.y + inset, fr.w - inset * 2, fr.h - inset * 2, unit * 0.04);
        g.stroke();
      }
      g.restore();
    }

    // live preview: drawn every frame over the (invisible) 3D canvas
    function drawCardPreview() {
      const dpr = window.devicePixelRatio, cw = canvasContainer.clientWidth, ch = canvasContainer.clientHeight;
      if (cardCanvas.width !== Math.round(cw * dpr) || cardCanvas.height !== Math.round(ch * dpr)) {
        cardCanvas.width = Math.round(cw * dpr); cardCanvas.height = Math.round(ch * dpr);
        cardCanvas.style.width = cw + 'px'; cardCanvas.style.height = ch + 'px';
      }
      const g = cardCanvas.getContext('2d');
      g.setTransform(1, 0, 0, 1, 0, 0);
      g.clearRect(0, 0, cardCanvas.width, cardCanvas.height);
      g.setTransform(dpr, 0, 0, dpr, 0, 0);
      const fr = cardFrameRect();
      g.fillStyle = '#1b1b24'; g.fillRect(0, 0, cw, ch);          // around the card
      composeCard(g, fr, renderer.domElement, { x: 0, y: 0, w: cw, h: ch }, projectItem(camera, cw, ch), renderer.domElement.width / cw);
      g.strokeStyle = 'rgba(255, 255, 255, 0.5)'; g.lineWidth = 1;
      g.strokeRect(fr.x + 0.5, fr.y + 0.5, fr.w - 1, fr.h - 1);
    }

    // Save Card PNG: render the item for exactly the card area at print size, then paint the card
    function renderCardPNG() {
      const [aw, ah] = $('cardAspect').value.split(':').map(Number);
      const outW = Math.round(THREE.MathUtils.clamp(+$('cardWidth').value || 1500, 300, 4000)), outH = Math.round(outW * ah / aw);
      const fr = cardFrameRect(), ch = canvasContainer.clientHeight, oldFov = camera.fov, oldRatio = renderer.getPixelRatio();
      camera.fov = THREE.MathUtils.radToDeg(2 * Math.atan(Math.tan(THREE.MathUtils.degToRad(oldFov) / 2) * fr.h / ch));
      camera.aspect = outW / outH;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(1);
      renderer.setSize(outW, outH, false);
      renderView();
      const c = document.createElement('canvas');
      c.width = outW; c.height = outH;
      composeCard(c.getContext('2d'), { x: 0, y: 0, w: outW, h: outH }, renderer.domElement, { x: 0, y: 0, w: outW, h: outH }, projectItem(camera, outW, outH), 1);
      camera.fov = oldFov;
      renderer.setPixelRatio(oldRatio);
      fitRenderer();
      return c;
    }

    // One-click looks to start from; every value can be adjusted afterwards
    const CARD_STYLES = {
      clean:     { label: 'Clean', cardBg: 'facets', cardC1: '#DCE8F2', cardC2: '#93AFC6', fxOutline: 0.5, fxOutlineColor: '#FFFFFF', fxGlow: 0, fxSparkle: 0, fxFocus: 0, fxBurst: 0, fxRings: 0, fxVignette: 0.25, fxBorder: 0.4, fxBorderColor: '#FFFFFF', cardShadow: true, silhouette: false },
      sparkle:   { label: 'Sparkle', cardBg: 'snow', cardC1: '#EAF3FB', cardC2: '#9EBEDB', fxOutline: 0.4, fxOutlineColor: '#FFFFFF', fxGlow: 0.7, fxGlowColor: '#FFFFFF', fxSparkle: 0.8, fxSparkleColor: '#FFFFFF', fxFocus: 0, fxBurst: 0, fxRings: 0, fxVignette: 0.2, fxBorder: 0.4, fxBorderColor: '#FFFFFF', cardShadow: true, silhouette: false },
      action:    { label: 'Action', cardBg: 'radial', cardC1: '#FFF4D6', cardC2: '#E5482F', fxOutline: 0.7, fxOutlineColor: '#1D1F26', fxGlow: 0.3, fxGlowColor: '#FFFFFF', fxSparkle: 0, fxFocus: 0.8, fxFocusColor: '#1D1F26', fxBurst: 0, fxRings: 0, fxVignette: 0.3, fxBorder: 0.5, fxBorderColor: '#1D1F26', cardShadow: false, silhouette: false },
      legendary: { label: 'Legendary', cardBg: 'radial', cardC1: '#FFF1C2', cardC2: '#B8862A', fxOutline: 0.6, fxOutlineColor: '#FFF6D8', fxGlow: 0.8, fxGlowColor: '#FFE08A', fxSparkle: 0.7, fxSparkleColor: '#FFF6D8', fxFocus: 0, fxBurst: 0.8, fxBurstColor: '#FFFFFF', fxRings: 0, fxVignette: 0.35, fxBorder: 0.7, fxBorderColor: '#D4A837', cardShadow: false, silhouette: false },
      night:     { label: 'Night', cardBg: 'night', cardC1: '#1B2A4D', cardC2: '#040817', fxOutline: 0.4, fxOutlineColor: '#9FD8FF', fxGlow: 0.6, fxGlowColor: '#7FD3C6', fxSparkle: 0.5, fxSparkleColor: '#CFF5FF', fxFocus: 0, fxBurst: 0, fxRings: 0.5, fxRingsColor: '#7FD3C6', fxVignette: 0.3, fxBorder: 0.4, fxBorderColor: '#7FD3C6', cardShadow: false, silhouette: false },
      silhouette:{ label: 'Silhouette', cardBg: 'lowpoly', cardC1: '#FFFFFF', cardC2: '#C9D2DC', fxOutline: 0, fxGlow: 0, fxSparkle: 0, fxFocus: 0, fxBurst: 0, fxRings: 0, fxVignette: 0, fxBorder: 0.35, fxBorderColor: '#1D1F26', cardShadow: false, silhouette: true },
      paper:     { label: 'Field Guide', cardBg: 'paper', cardC1: '#EFE3C8', cardC2: '#8C5A35', fxOutline: 0.5, fxOutlineColor: '#3A2A1E', fxGlow: 0, fxSparkle: 0, fxFocus: 0, fxBurst: 0, fxRings: 0.35, fxRingsColor: '#8C5A35', fxVignette: 0.15, fxBorder: 0.5, fxBorderColor: '#3A2A1E', cardShadow: true, silhouette: false }
    };

    function applyCardStyle(key) {
      const st = CARD_STYLES[key];
      for (const id in st) {
        if (id === 'label') continue;
        const el = $(id);
        if (el.type === 'checkbox') el.checked = st[id]; else el.value = st[id];
      }
      if (!cardOn()) { $('cardMode').checked = true; updateCardMode(); }
      refreshFxLabels();
      document.querySelectorAll('[data-card-style]').forEach(b => b.classList.toggle('active', b.dataset.cardStyle === key));
    }

    const FX_SLIDERS = ['cardSize', 'fxOutline', 'fxGlow', 'fxSparkle', 'fxFocus', 'fxBurst', 'fxRings', 'fxVignette', 'fxBorder'];
    function refreshFxLabels() { FX_SLIDERS.forEach(id => $(id + '-val').innerText = fxv(id).toFixed(2)); }

    function updateCardMode() {
      const on = cardOn();
      document.body.classList.toggle('card', on);
      $('cardControls').style.display = on ? '' : 'none';
      $('cardFxBox').style.display = on ? '' : 'none';   // the effects only apply to the card
      renderer.domElement.style.opacity = on ? 0 : 1;   // still there to receive the mouse; the card canvas shows the result
      cardCanvas.style.display = on ? 'block' : 'none';
      updateScene();
      frameItem();
    }

    for (const key in CARD_STYLES) {
      const b = document.createElement('button');
      b.textContent = CARD_STYLES[key].label;
      b.dataset.cardStyle = key;
      b.addEventListener('click', () => applyCardStyle(key));
      $('cardStyleBtns').appendChild(b);
    }
    $('cardMode').addEventListener('change', updateCardMode);
    FX_SLIDERS.forEach(id => $(id).addEventListener('input', refreshFxLabels));
    $('cardSize').addEventListener('input', fitToCard);
    $('cardAspect').addEventListener('change', fitToCard);
    $('rerollCard').addEventListener('click', () => { cardSeed = 1 + Math.floor(Math.random() * 100000); });
    $('saveCard').addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = `${fileBase()}-card.png`;
      link.href = renderCardPNG().toDataURL('image/png');
      link.click();
    });
    refreshFxLabels();

    updateScene();
    selectItem(currentItem);

    // --- RENDER LOOP ---
    function animate() {
      requestAnimationFrame(animate);
      if (window.studioPaused) return; // hidden tab in the Art Studio
      cameraKeys();
      controls.update();
      renderView();
      if (cardOn()) drawCardPreview();   // same frame, while the 3D image is still in the canvas
    }
    animate();
  </script>
</body>
</html>
